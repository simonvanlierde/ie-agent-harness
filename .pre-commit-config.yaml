# Works with prek or pre-commit. Install: prek install   (or: pre-commit install)
default_install_hook_types: [pre-commit, commit-msg]
default_stages: [pre-commit]
repos:
  - repo: local
    hooks:
      - id: guard-golden
        name: golden tests need a person's approval
        entry: scripts/guard-golden.sh
        language: script
        stages: [commit-msg]
        always_run: true
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format --check
        language: system
        types: [python]
      - id: pytest
        name: pytest
        entry: uv run pytest -q
        language: system
        pass_filenames: false
        always_run: true
