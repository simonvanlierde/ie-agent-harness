[project]
name = "toy-lca"
version = "0.1.0"
description = "Toy matrix LCA with the checks that keep an AI agent's changes honest"
keywords = ["life cycle assessment", "industrial ecology", "AI agents", "reproducibility", "teaching"]
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.5",
]

[project.urls]
Repository = "https://github.com/simonvanlierde/ie-agent-harness"
"Verify AI-assisted work" = "https://ai4ie.org/best-practices/verify/"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
